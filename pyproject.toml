[project]
name = "pepkio-oligo-qc-instant"
version = "0.1.0"
description = "Python client for Pepkio oligo-qc-instant tool"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-oligo-qc-instant = "pepkio_oligo_qc_instant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_oligo_qc_instant"]

[dependency-groups]
dev = [
    "hatchling>=1.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
